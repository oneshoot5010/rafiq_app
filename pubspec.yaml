name: rafiq_app
description: تطبيق رفيق - مرافق يومي للمسلم (مواقيت الصلاة، القبلة، الأذكار، التقويم الهجري)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1        # لتحديد الموقع الجغرافي (لمواقيت الصلاة والقبلة)
  shared_preferences: ^2.3.2 # لحفظ عداد التسبيح والإعدادات محليًا على الجهاز
  intl: ^0.19.0              # لتنسيق التاريخ الميلادي بالعربي

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
